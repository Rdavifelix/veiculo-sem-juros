<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420">
  <!-- Padrão de rabiscos próprio do Veículo Sem Juros (carros, chaves, martelo, moedas, etiquetas), em tom de ardósia sobre azul-marinho. -->
  <rect width="420" height="420" fill="#0f1b2d"/>
  <g fill="none" stroke="#1a2a3f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- carro -->
    <g transform="translate(28 40)">
      <path d="M4 26h64l-8-16H16z M0 26v10h8a6 6 0 0 0 12 0h32a6 6 0 0 0 12 0h8V26"/>
      <circle cx="14" cy="36" r="5"/><circle cx="58" cy="36" r="5"/>
    </g>
    <!-- chave -->
    <g transform="translate(140 30) rotate(-30)">
      <circle cx="10" cy="10" r="9"/><path d="M18 10h36v8h-6v-5h-5v5h-6v-5H18"/>
    </g>
    <!-- martelo de leilão -->
    <g transform="translate(250 24) rotate(40)">
      <rect x="0" y="0" width="30" height="16" rx="3"/><path d="M15 16v40M5 56h20"/>
    </g>
    <!-- moedas -->
    <g transform="translate(340 44)">
      <ellipse cx="16" cy="6" rx="16" ry="6"/><path d="M0 6v10c0 3 7 6 16 6s16-3 16-6V6M0 16v10c0 3 7 6 16 6s16-3 16-6V16"/>
    </g>
    <!-- etiqueta de preço -->
    <g transform="translate(40 140) rotate(-20)">
      <path d="M0 8l8-8h28v28L8 36 0 28z"/><circle cx="10" cy="10" r="3"/><path d="M16 22l12-12"/>
    </g>
    <!-- estrela -->
    <path transform="translate(130 150)" d="M10 0l3 7 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/>
    <!-- balão de conversa -->
    <g transform="translate(190 120)">
      <path d="M0 6a6 6 0 0 1 6-6h40a6 6 0 0 1 6 6v22a6 6 0 0 1-6 6H18l-10 8v-8H6a6 6 0 0 1-6-6z"/><path d="M12 12h28M12 20h18"/>
    </g>
    <!-- celular -->
    <g transform="translate(300 130)">
      <rect x="0" y="0" width="28" height="50" rx="5"/><path d="M10 5h8M14 44h.01"/>
    </g>
    <!-- calendário -->
    <g transform="translate(360 150)">
      <rect x="0" y="4" width="36" height="32" rx="4"/><path d="M0 14h36M8 0v8M28 0v8"/>
    </g>
    <!-- moto -->
    <g transform="translate(30 250)">
      <circle cx="10" cy="26" r="9"/><circle cx="56" cy="26" r="9"/><path d="M10 26l14-14h16l6 8 10 6M26 12l-6-8h-8M40 12l8-6"/>
    </g>
    <!-- coração -->
    <path transform="translate(130 240)" d="M12 22L2 12a6 6 0 0 1 10-7 6 6 0 0 1 10 7z"/>
    <!-- lupa -->
    <g transform="translate(180 230)"><circle cx="12" cy="12" r="11"/><path d="M20 20l12 12"/></g>
    <!-- caminhão -->
    <g transform="translate(240 250)">
      <path d="M0 6h40v26H0zM40 14h16l10 10v8H40z"/><circle cx="12" cy="36" r="5"/><circle cx="56" cy="36" r="5"/>
    </g>
    <!-- cadeado -->
    <g transform="translate(350 250)"><rect x="0" y="14" width="26" height="20" rx="4"/><path d="M6 14V9a7 7 0 0 1 14 0v5"/></g>
    <!-- porcentagem -->
    <g transform="translate(60 350)"><circle cx="6" cy="6" r="5"/><circle cx="26" cy="26" r="5"/><path d="M2 30L30 2"/></g>
    <!-- documento -->
    <g transform="translate(140 340)"><path d="M0 0h22l10 10v30H0z M22 0v10h10"/><path d="M6 20h20M6 28h14"/></g>
    <!-- velocímetro -->
    <g transform="translate(220 340)"><path d="M0 30a30 30 0 0 1 60 0"/><path d="M30 30l14-16"/><circle cx="30" cy="30" r="3"/></g>
    <!-- joinha -->
    <g transform="translate(320 340)"><path d="M0 16h8v20H0zM8 18l8-14c4 0 6 2 6 6l-2 8h12a4 4 0 0 1 4 4l-4 14a4 4 0 0 1-4 4H8"/></g>
    <!-- pontinhos e estrelinhas soltas -->
    <circle cx="110" cy="100" r="2"/><circle cx="330" cy="100" r="2"/><circle cx="230" cy="200" r="2"/><circle cx="100" cy="300" r="2"/><circle cx="400" cy="320" r="2"/><circle cx="20" cy="400" r="2"/>
    <path transform="translate(395 70) scale(.5)" d="M10 0l3 7 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/>
    <path transform="translate(280 190) scale(.5)" d="M10 0l3 7 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/>
    <path transform="translate(70 200) scale(.5)" d="M10 0l3 7 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/>
    <path transform="translate(190 395) scale(.5)" d="M10 0l3 7 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/>
  </g>
</svg>
